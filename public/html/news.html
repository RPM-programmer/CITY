<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/redact.css" />
    <script src="/js/news.js" defer></script>
    <title>CITY — NEWS</title>
  </head>
  <body>
    <form class="card-form" action="/news/create" method="post">
      <a href="/html/index.html" class="back-link">← На главную</a>

      <h2>Создать новость</h2>

      <div class="form-group">
        <label for="news-title">Заголовок</label>
        <input
          type="text"
          name="title"
          id="news-title"
          placeholder="Введите заголовок новости"
          required
        />
      </div>

      <div class="form-group">
        <label for="news-text">Текст новости</label>
        <textarea
          name="text"
          id="news-text"
          placeholder="Напишите основной текст..."
          required
        ></textarea>
      </div>

      <input type="submit" value="Опубликовать" />
      <p class="form-status"></p>
    </form>
  </body>
</html>
