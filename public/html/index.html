<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/redact.css" />
    <title>CITY — Панель управления</title>
  </head>
  <body>
    <div class="card-form">
      <a href="/" class="back-link">← На главную</a>
      <div class="dashboard-header">
        <h2>Панель управления</h2>
        <p class="subtitle">Выберите действие, которое хотите выполнить</p>
      </div>

      <div class="action-grid">
        <a href="/html/game.html" class="action-card">
          <div class="action-icon">🎮</div>
          <div class="action-info">
            <h3>Настроить игру</h3>
            <p>Указать дату и время следующего запуска</p>
          </div>
          <span class="action-arrow">→</span>
        </a>

        <a href="/html/news.html" class="action-card">
          <div class="action-icon">📰</div>
          <div class="action-info">
            <h3>Создать новость</h3>
            <p>Опубликовать новый пост на сайте</p>
          </div>
          <span class="action-arrow">→</span>
        </a>
      </div>
    </div>
  </body>
</html>
