<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ошибка сети 504</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: #050b14;
        color: #e0f2fe;
      }
      .block {
        text-align: center;
        max-width: 460px;
        background: rgba(14, 165, 233, 0.02);
        border: 1px solid rgba(14, 165, 233, 0.15);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(14, 165, 233, 0.05);
      }
      .cloud-icon {
        font-size: 54px;
        margin-bottom: 15px;
        opacity: 0.8;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      p {
        color: #7dd3fc;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="block">
      <div class="cloud-icon">☁️❌</div>
      <h1>Таймаут сетевого узла</h1>
      <p>
        Облачная инфраструктура зафиксировала зависание процесса на основном
        сервере. Запрос аннулирован вышестоящим маршрутизатором.
      </p>
    </div>
  </body>
</html>
