<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: #fafafa;
        color: #1c1917;
      }
      .wrapper {
        max-width: 400px;
        padding: 20px;
        border-left: 4px solid #1c1917;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }
      p {
        color: #57534e;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 20px;
      }
      .link {
        display: inline-block;
        font-size: 14px;
        color: #1c1917;
        font-weight: bold;
        text-decoration: underline;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>Элемент не найден</h1>
      <p>
        Запрошенный URL-адрес не может быть обработан сервером маршрутизации.
        Пожалуйста, вернитесь на один шаг назад.
      </p>
      <span onclick="window.history.back()" class="link">Назад</span>
    </div>
  </body>
</html>
