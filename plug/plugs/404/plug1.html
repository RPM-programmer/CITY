<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ошибка 404 | Страница не найдена</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: #0f172a;
        color: #f8fafc;
      }
      .card {
        max-width: 500px;
        text-align: center;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 45px 40px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }
      .num {
        font-size: 84px;
        font-weight: 900;
        line-height: 1;
        color: #3b82f6;
        letter-spacing: -2px;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 12px;
        color: #ffffff;
      }
      p {
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="num">404</div>
      <h1>Страница потерялась</h1>
      <p>
        Адрес введен некорректно, либо эта страница была удалена, перемещена или
        никогда не существовала. Проверьте правильность ссылки.
      </p>
    </div>
  </body>
</html>
