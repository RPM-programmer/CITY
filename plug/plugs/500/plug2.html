<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ошибка сервера (500)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: #fafafa;
        color: #1c1917;
      }
      .wrapper {
        max-width: 400px;
        padding: 20px;
        border-left: 4px solid #ea580c;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      p {
        color: #57534e;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .code {
        font-family: monospace;
        font-size: 12px;
        color: #a8a29e;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>Ошибка выполнения запроса</h1>
      <p>
        Не удалось корректно завершить операцию. Мы зафиксировали этот инцидент
        и автоматически отправили отчет разработчикам.
      </p>
      <div class="code">Статус ответа: 500 Internal Server Error</div>
    </div>
  </body>
</html>
