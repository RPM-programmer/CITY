<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Скоро вернемся</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: #f0fdf4;
        color: #166534;
      }
      .card {
        text-align: center;
        max-width: 420px;
        background: #ffffff;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(22, 101, 52, 0.05);
        border: 1px solid #bbf7d0;
      }
      .coffee {
        font-size: 50px;
        margin-bottom: 15px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      p {
        color: #14532d;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="coffee">⏳</div>
      <h1>Время подождать</h1>
      <p>
        Мы ненадолго приостановили работу сервера, что-бы провести плановые
        технические работы. Сервер снова начнёт работать через несколько
        минут...<br />Спасибо за ожидание
      </p>
    </div>
  </body>
</html>
