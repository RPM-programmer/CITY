<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Технические работы | Сервер временно недоступен</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f4f6f9;
        color: #333333;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 500px;
        background: #ffffff;
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      }

      .icon {
        font-size: 64px;
        margin-bottom: 20px;
        display: inline-block;
        animation: pulse 2s infinite ease-in-out;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #1e293b;
      }

      p {
        font-size: 16px;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .btn {
        display: inline-block;
        background-color: #4f46e5;
        color: #ffffff;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 8px;
        transition: background-color 0.2s ease;
      }

      .btn:hover {
        background-color: #4338ca;
      }

      .footer {
        margin-top: 32px;
        font-size: 13px;
        color: #94a3b8;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Эмодзи вместо тяжелой графики, чтобы страница загружалась моментально -->
      <div class="icon">🛠️</div>

      <h1>Сервер временно недоступен</h1>

      <p>
        Мы уже в курсе проблемы и проводим технические работы. Обычно это
        занимает не больше пары минут. Пожалуйста, обновите страницу чуть позже.
      </p>

      <a href="javascript:window.location.reload();" class="btn"
        >Обновить страницу</a
      >

      <div class="footer">Код ошибки: 503 Service Unavailable</div>
    </div>
  </body>
</html>
