<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Техническое обслуживание | Сайт временно недоступен</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #fafafa;
        color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .maintenance-card {
        text-align: center;
        max-width: 500px;
        background: #ffffff;
        padding: 40px 30px;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }

      .gear-icon {
        font-size: 56px;
        margin-bottom: 20px;
        display: inline-block;
        animation: spin 4s infinite linear;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #0f172a;
      }

      p {
        font-size: 15px;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #f1f5f9;
        padding: 8px 16px;
        border-radius: 30px;
        font-size: 13px;
        color: #475569;
        font-weight: 500;
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        background-color: #3b82f6;
        border-radius: 50%;
        animation: pulse 1.5s infinite ease-in-out;
      }

      .error-code {
        margin-top: 35px;
        font-family: monospace;
        font-size: 12px;
        color: #94a3b8;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="maintenance-card">
      <div class="gear-icon">⚙️</div>

      <h1>Ведутся технические работы</h1>

      <p>
        Мы обновляем программное обеспечение, чтобы сделать сервис быстрее и
        стабильнее. Это плановое обслуживание, и мы скоро вернемся в строй.
      </p>

      <div class="status-badge">
        <div class="pulse-dot"></div>
        <span>Ожидаем запуск основного сервера...</span>
      </div>

      <div class="error-code">HTTP Status: 503 Service Unavailable</div>
    </div>

    <script>
      // Автоматическая проверка: каждую минуту пытаемся "постучаться" на главную страницу.
      // Как только основной сервер оживет и вернет код 200 вместо 503, страница сама обновится.
      setInterval(function () {
        fetch("/", { method: "HEAD", cache: "no-store" })
          .then(function (response) {
            if (response.status === 200) {
              window.location.reload();
            }
          })
          .catch(function () {
            // Если резервный сервер изолирован, ошибок в консоли не избежать,
            // но скрипт продолжит попытки.
          });
      }, 30000); // 30000 мс = 30 секунд
    </script>
  </body>
</html>
