<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Технические работы</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: #f3f4f6;
        color: #1f2937;
      }
      .card {
        text-align: center;
        max-width: 460px;
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        border: 1px solid #e5e7eb;
      }
      .gear {
        font-size: 60px;
        display: inline-block;
        animation: spin 4s infinite linear;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 12px;
        color: #111827;
      }
      p {
        color: #4b5563;
        font-size: 15px;
        line-height: 1.6;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="gear">⚙️</div>
      <h1>Ведутся плановые работы</h1>
      <p>
        Мы улучшаем архитектуру проекта и обновляем базы данных. Сайт вернется в
        строй в течение нескольких минут. Спасибо за терпение!
      </p>
    </div>
  </body>
</html>
