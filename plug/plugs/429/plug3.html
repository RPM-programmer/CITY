<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>429 Too Many Requests</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: #ffffff;
        color: #000000;
      }
      .wrapper {
        max-width: 450px;
        border-top: 5px solid #000000;
        padding-top: 25px;
      }
      h1 {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 10px;
      }
      p {
        color: #555555;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>429. Превышена частота запросов</h1>
      <p>
        Аппаратный брандмауэр ограничил поток данных для вашего сетевого
        идентификатора. Запросы временно отклоняются во избежание деградации
        производительности кластера.
      </p>
    </div>
  </body>
</html>
