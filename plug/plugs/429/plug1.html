<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ошибка 429 | Превышен лимит запросов</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: #090d16;
        color: #f8fafc;
      }
      .card {
        max-width: 480px;
        text-align: center;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(234, 179, 8, 0.2);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .icon {
        font-size: 64px;
        color: #eab308;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 12px;
        color: #ffffff;
        letter-spacing: -0.5px;
      }
      p {
        color: #9ca3af;
        font-size: 15px;
        line-height: 1.6;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(0.98);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🛑</div>
      <h1>Слишком много запросов</h1>
      <p>
        Система безопасности зафиксировала подозрительно высокую активность с
        вашего IP-адреса. Скорость отправки запросов временно ограничена.
        Пожалуйста, подождите пару минут.
      </p>
    </div>
  </body>
</html>
